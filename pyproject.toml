[project]
name = "kafka-python-lesson"
version = "0.1.0"
description = "Hebrew Kafka teaching notebook with Python, uv, and Cursor"
requires-python = ">=3.13.12,<3.14"
dependencies = [
  "confluent-kafka==2.16.2",
  "opensearch-py==3.2.0",
  "requests==2.34.2",
]

[dependency-groups]
dev = ["ipykernel>=6.30.1,<8"]

[tool.uv]
package = false
